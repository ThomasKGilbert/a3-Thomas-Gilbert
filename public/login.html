<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8' />
    <script src='js/login.js' defer></script>
    <title>Login - CS4241 Assignment 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='style.css' />

    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
</head>
<body class="font-['JetBrains_Mono']">
    <!-- Out-Most Container -->
    <div class="w-full min-h-screen bg-gradient-to-r from-[#667db6] via-[#0082c8] to-[#667db6] p-2.5 flex justify-center items-center">
        <div class="bg-white w-full max-w-125 rounded-2xl p-5">
            <h1 class="text-2xl font-bold mb-2">Log In</h1>

            <form id="login-form" class="flex flex-col gap-2.5">
                <input type="text" id="username" placeholder="Username" required class="rounded-lg p-2 border-2 border-black outline-none"/>
                <input type="text" id="password" placeholder="Password" required class="rounded-lg p-2 border-2 border-black outline-none"/>
                <button type="submit" class="rounded-lg border-none bg-orange-400 cursor-pointer p-2">Log In</button>
            </form>

            <p id="message" class="text-red-500 text-sm mt-2"></p>
        </div>
    </div>
</body>
</html>

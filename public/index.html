<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset='utf-8' />
    <meta name="description" content="Todo-List app to manage daily tasks with select priority levels that generates appropriate deadlines" />
    <script src='js/main.js' defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='style.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body class="font-['JetBrains_Mono']">
    <!-- Out-Most Container -->
    <main class="w-full min-h-screen bg-gradient-to-r from-[#667db6] via-[#0082c8] to-[#667db6] p-2.5 flex justify-center items-center">
      <div class="bg-white w-full max-w-150 rounded-2xl p-5">
        <h1 class="text-2xl font-bold mb-2">To-Do List</h1>

        <div id="todo-row" class="w-full pt-2.5 flex justify-between gap-2.5">
          <input type="text" id="task-text" name="task" placeholder="Enter task" class="flex-1 rounded-lg p-2 border-2 border-black outline-none">
          <label for="priority" class="sr-only">Priority</label>
          <select id="priority" name="priority" class="border-2 border-black rounded-lg p-1">
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low">Low Priority</option>
          </select>
          <button onclick="addTask()" id="add-task" class="w-full max-w-22 rounded-lg border-none bg-orange-400 cursor-pointer">Add Task</button>
        </div>

        <ul id="task-list-container">
        </ul>
      </div>
    </main>
  </body>
</html>
